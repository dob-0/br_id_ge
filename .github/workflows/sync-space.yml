name: Sync di.iiii Space

# Pushes the repo's surfaces into the linked di.iiii space (/br_id_ge) on every
# change to the content. The binding lives in the di-space*.json manifests; the
# engine is scripts/sync-space.mjs.
#
# EVERY TIER, EVERY TIME. This used to sync prod alone, and staging silently
# drifted four days and a whole redesign behind — the old void-and-cyan door was
# still standing there while prod wore paper and ink. Staging goes first, as the
# rehearsal it is; a staging failure warns but never holds the live space back.
#
# Secrets: DI_SPACE_TOKEN (prod) and DI_SPACE_TOKEN_STAGING (staging) — di.iiii
# editor tokens scoped to this space, one per tier because the tiers do not
# share a database. A tier with no token is skipped with a loud warning.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'bridge.html'
      - 'field.html'
      - 'di-space.space.json'
      - 'di-space.json'
      - 'di-space.landing.json'
      - 'di-space.field.json'
      - 'assets/**'
      - 'scripts/sync-space.mjs'
      - '.github/workflows/sync-space.yml'
  workflow_dispatch: {}

# Never cancel a sync in flight. A cancelled run can die between staging and prod,
# or between two manifests, leaving a new door over an old rite — and a cancelled
# run sends no failure mail, so the split would be silent. These runs take ~20s;
# queueing the next one costs nothing.
concurrency:
  group: sync-space
  cancel-in-progress: false

jobs:
  # A drifted engine must not be allowed to sync production. See vendor-check.yml
  # and docs/ai/space-sync-vendoring.md (di.iiii) — this is what makes engine drift
  # fail loudly instead of stalling uncommitted for 15+ hours the way it did on
  # 2026-08-06, when nothing here was checking against di.iiii at all.
  vendor-check:
    uses: ./.github/workflows/vendor-check.yml

  sync:
    needs: vendor-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard — the live token must be present
        env:
          DI_SPACE_TOKEN: ${{ secrets.DI_SPACE_TOKEN }}
        run: |
          if [ -z "$DI_SPACE_TOKEN" ]; then
            echo "::error::Missing secret DI_SPACE_TOKEN (a di.iiii editor token scoped to this space)."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Repo is the single source of truth for ALL projects in the space.
      # The landing (bridge.html) is the published face; the rite and the field
      # sync with publish:false so they never steal the pointer.
      - name: Sync every surface to every tier
        env:
          PROD_TOKEN: ${{ secrets.DI_SPACE_TOKEN }}
          STAGING_TOKEN: ${{ secrets.DI_SPACE_TOKEN_STAGING }}
        run: |
          set -euo pipefail

          sync_tier () {
            tier="$1"; base="$2"; token="$3"
            if [ -z "$token" ]; then
              echo "::warning::$tier skipped — no token secret set. That tier WILL drift out of sync."
              return 1
            fi
            echo "──────── $tier → $base"
            # --all walks the project list in di-space.space.json, so adding a
            # surface to the repo no longer means remembering to add it here.
            LIVE_API_TOKEN="$token" node scripts/sync-space.mjs --repo . --all --to "$base"
          }

          # rehearsal first — but never let it hold the live space back
          staging_ok=1
          sync_tier staging https://staging.di-studio.xyz/serverXR "${STAGING_TOKEN:-}" \
            || { staging_ok=0; echo "::warning::staging sync did not complete — prod continues, staging is now behind."; }

          sync_tier prod https://di-studio.xyz/serverXR "$PROD_TOKEN"

          # Prod is synced; now let the run go red. A skipped tier used to leave the
          # job green, so staging drifted a whole redesign behind with nothing to
          # show for it but an annotation nobody opens.
          if [ "$staging_ok" -eq 0 ]; then
            echo "::error::staging did not sync. Prod is current; staging is behind and will stay behind until this is fixed."
            exit 1
          fi

      # A sync that reports success is not the same as tiers that agree. Every
      # drift this repo has been bitten by was found by a person opening prod
      # and staging side by side and noticing a name was different — which only
      # ever works for the surfaces someone happens to look at. This reads both
      # tiers and fails the run on any difference the manifests do not declare.
      # Read-only, so it is safe against the live space.
      - name: Audit — every governed tier must match the repo
        env:
          PROD_API_TOKEN: ${{ secrets.DI_SPACE_TOKEN }}
          LIVE_API_TOKEN: ${{ secrets.DI_SPACE_TOKEN_STAGING }}
        run: node scripts/sync-space.mjs --repo . --audit
