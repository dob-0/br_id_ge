<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@300;400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* PAPER AND INK — the field speaks the rite's face: warm paper ground, one ink,
   one graphite, one live blue. The only depth on the page is the cores
   themselves: what the crossings left. Everything else is print. */
:root{
  --paper:#f3f1ec; --ink:#131313; --graphite:#8f8b83; --hairline:#dcd8cf;
  --live:#1d4bff;
  --arm:'Noto Serif Armenian',Georgia,serif;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
canvas{display:block;cursor:grab}
canvas.grabbing{cursor:grabbing}
#frame{position:fixed;inset:10px;border:1px solid var(--hairline);z-index:1;pointer-events:none}
@media (max-width:560px){#frame{inset:8px}}
.hud{position:fixed;z-index:2;pointer-events:none;font-size:.55rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--graphite);line-height:1.9}
#hd{top:0;left:0;padding:1.35rem;color:var(--ink)}
#hd b{font-weight:400}
#hd .arm{font-family:var(--arm);font-weight:300;color:var(--graphite);
  letter-spacing:.5em;margin-top:.3rem;font-size:.6rem;text-transform:none}
#count{top:0;right:0;padding:1.35rem;text-align:right}
#count .n{color:var(--ink);font-weight:400}
#cta{bottom:0;left:0;padding:1.35rem;pointer-events:auto}
#cta a{color:var(--live);text-decoration:none;border-bottom:1px solid var(--hairline);
  padding-bottom:.25rem;transition:border-color .25s}
#cta a:hover{border-color:var(--live)}
#hint{bottom:0;right:0;padding:1.35rem;text-align:right}
#mode{bottom:0;left:50%;transform:translateX(-50%);padding:1.35rem;pointer-events:auto;
  background:none;border:none;cursor:pointer;font-family:var(--mono);font-size:.55rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
#mode:hover{color:var(--live)}
#kPanel{position:fixed;z-index:4;top:50%;right:1.6rem;transform:translateY(-50%);
  width:min(19rem,calc(100vw - 3rem));background:var(--paper);border:1px solid var(--hairline);
  padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.7rem;font-family:var(--mono)}
#kPanel .kHead{display:flex;justify-content:space-between;align-items:center;
  font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
#kClose{background:none;border:none;cursor:pointer;color:var(--graphite);
  font-size:1rem;line-height:1;padding:0}
#kClose:hover{color:var(--ink)}
#kState{font-size:.55rem;letter-spacing:.16em;color:var(--graphite);text-transform:lowercase}
#kEye{width:100%;border:1px solid var(--hairline);filter:grayscale(1) contrast(1.05)}
#kLog{display:flex;flex-direction:column;gap:.45rem;max-height:9rem;overflow-y:auto;
  font-size:.66rem;line-height:1.55}
#kLog .me{color:var(--graphite)}
#kLog .it{color:var(--ink)}
#kLog .it b{color:var(--live);font-weight:400}
#kIn{width:100%;background:none;border:none;border-bottom:1px solid var(--hairline);
  font-family:var(--mono);font-size:.7rem;color:var(--ink);padding:.35rem 0;outline:none}
#kIn:focus{border-color:var(--live)}
#kIn::placeholder{color:var(--graphite)}
@media (prefers-reduced-motion: no-preference){
  .hud,#frame{opacity:0;animation:fade 1.2s .3s ease forwards}
  canvas{opacity:0;animation:fade 1.6s ease forwards}
  @keyframes fade{to{opacity:1}}
}
@media (max-width:560px){#hd,#count,#cta,#hint{padding:1.1rem}#hint{display:none}}
</style>
</head>
<body>
<div id="frame"></div>
<canvas id="c"></canvas>
<div class="hud" id="hd"><b>br_id_ge</b> · vi.ritual · the field<div class="arm">Կ Ա Մ ՈՒ Ր Ջ</div></div>
<div class="hud" id="count"><span class="n" id="n">0</span> cores<br><span id="countLine">each one = a crossing</span><br><span id="others"></span></div>
<div class="hud" id="cta"><a href="https://di-studio.xyz/br_id_ge/rite" target="_top">cross the bridge →</a></div>
<button class="hud" id="mode">all together →</button>
<!-- the keeper's window — tap the lattice: see through jet.di's eye, speak to it.
     Two bodies may keep: jet.di, the robot in the room (eye + speaker), and
     di.bo, the messenger on the wire (voice only). docs/KEEPER.md holds both. -->
<div id="kPanel" hidden>
  <div class="kHead"><span>պահապան · the keeper</span><button id="kClose">×</button></div>
  <div id="kState">asleep — no body is on the mesh</div>
  <img id="kEye" alt="" hidden>
  <div id="kLog"></div>
  <form id="kForm"><input id="kIn" placeholder="speak to it" autocomplete="off" maxlength="120"></form>
</div>
<div class="hud" id="hint">tap — ink finds the crossings<br>drag orbit · scroll zoom</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three'
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js'

// The field reads THE ONE SPACE. Same-origin only when actually served from
// di.iiii; everywhere else (Pages mirror, file://, serve.mjs) the absolute URL
// is the default — serve.mjs rewrites it to the chosen tier. ?api= overrides.
// published pages run inside a srcdoc iframe, which has no URL of its own —
// location.search is empty there and the viewer hands the shell's query down
// as diiPageQuery instead. Local mirror still uses the real one.
const QRY=new URLSearchParams(window.diiPageQuery||location.search);

const API=QRY.get('api')||
  (location.hostname.endsWith('di-studio.xyz')
    ?'/serverXR/api/spaces/br_id_ge':'https://di-studio.xyz/serverXR/api/spaces/br_id_ge');

const PAPER=0xf3f1ec
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(PAPER,0.020);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(46,1,0.1,300);
camera.position.set(0,7,26);camera.lookAt(0,1,0);
const world=new THREE.Group();scene.add(world);

// every crossing leaves its OWN form — seeded by the inscription id, so the
// shape is as permanent as the word: the same knot on every load, unique to
// that one crossing. One chrome for all of them: many bodies, one matter.
const coreMat=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:1,roughness:0.16,
  iridescence:1,iridescenceIOR:1.55,envMapIntensity:1.15});
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const PQ=[[2,3],[2,5],[3,4],[3,5],[4,5],[5,2],[3,2],[5,3],[4,3],[5,4]];
function coreGeoFor(id){const r=rng(hash(String(id)));
  const [p,q]=PQ[Math.floor(r()*PQ.length)];
  return new THREE.TorusKnotGeometry(0.62+r()*0.36,0.2+r()*0.22,200,28,p,q);}

// the ground is the page: a hairline ring where the field begins
{const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,3.24,128),
  new THREE.MeshBasicMaterial({color:0xdcd8cf,side:THREE.DoubleSide}));
 ring.rotation.x=-Math.PI/2;ring.position.y=0.01;world.add(ring);}

// graphite dust — printed specks, not embers
{const p=new Float32Array(390);for(let i=0;i<p.length;i++)p[i]=(Math.random()-.5)*80;
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));
 scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0x8f8b83,size:.07,transparent:true,opacity:.5})));}

const cores=new Map(); // objectId -> group
// word + name rendered as ONE billboard texture — a sprite always faces the
// camera, so a single texture can never read mirrored as the field rotates
function labelTex(word,name){const cv=document.createElement('canvas');cv.width=512;cv.height=192;
  const g=cv.getContext('2d');g.textAlign='center';
  g.font='300 54px "Noto Serif Armenian", Georgia, serif';g.fillStyle='#131313';
  g.fillText(word.slice(0,12),256,80);
  g.font='22px "Space Mono", monospace';g.fillStyle='#8f8b83';
  g.fillText(name.slice(0,20),256,134);
  const t=new THREE.CanvasTexture(cv);t.minFilter=THREE.LinearFilter;return t;}
// a soft contact shadow, so each core sits on the page instead of floating off it
const shadowTex=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=128;
  const g=cv.getContext('2d');const gr=g.createRadialGradient(64,64,4,64,64,60);
  gr.addColorStop(0,'rgba(19,19,19,0.30)');gr.addColorStop(1,'rgba(19,19,19,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(cv);t.minFilter=THREE.LinearFilter;return t;})();
function placeCore(tag,i,id){
  const a=i*2.399,r=4+i*0.85;
  const pos=new THREE.Vector3(Math.cos(a)*r,1.5+Math.sin(i*1.7)*.3,Math.sin(a)*r);
  const grp=new THREE.Group();grp.position.copy(pos);
  const rnd=rng(hash(String(id)+'~'));
  const knot=new THREE.Mesh(coreGeoFor(id),coreMat);
  const s=0.52+rnd()*0.2;knot.scale.setScalar(s);
  knot.rotation.set(rnd()*Math.PI*2,rnd()*Math.PI*2,rnd()*Math.PI*2);
  grp.add(knot);
  const sh=new THREE.Sprite(new THREE.SpriteMaterial({map:shadowTex,transparent:true,depthWrite:false}));
  sh.position.set(0,-pos.y+0.06,0);sh.scale.set(2.6,2.6,1);grp.add(sh);
  const parts=String(tag).split('·');const word=(parts.pop()||'').trim();const name=parts.join('·').trim();
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(word,name),transparent:true,depthWrite:false}));
  label.position.set(0,1.55,0);label.scale.set(4.2,1.575,1);grp.add(label);
  grp.userData={phase:i*1.31,home:pos.clone(),gather:new THREE.Vector3(),m:0,word,
    rev:0,revT:0,speed:0.022+rnd()*0.022,scale:s,knot,label,shadow:sh,born:performance.now()};
  grp.visible=false;
  world.add(grp);return grp;}

// UNFINISHED SWAN — the field arrives blank. The page is paper; the cores are
// there but unprinted. A tap throws ink: a stain blooms on the ground and the
// crossings it touches become visible. You reveal the field the way the rite
// reveals the body — by marking it. The gather and a fresh arrival print
// everything: the ceremony outranks the game.
const stainTex=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=256;
  const g=cv.getContext('2d');const r=rng(7);g.fillStyle='#131313';
  for(let i=0;i<26;i++){const a=r()*Math.PI*2,d=Math.pow(r(),2)*92,s=6+r()*30;
    g.globalAlpha=.10+r()*.16;g.beginPath();
    g.arc(128+Math.cos(a)*d,128+Math.sin(a)*d,s,0,Math.PI*2);g.fill();}
  g.globalAlpha=.32;g.beginPath();g.arc(128,128,52,0,Math.PI*2);g.fill();
  const t=new THREE.CanvasTexture(cv);t.minFilter=THREE.LinearFilter;return t;})();
const stains=[];
function throwInk(local){
  const st=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:stainTex,transparent:true,opacity:.34,depthWrite:false}));
  st.rotation.x=-Math.PI/2;st.rotation.z=Math.random()*Math.PI*2;
  st.position.set(local.x,0.02+stains.length*0.0004,local.z);
  st.userData={born:performance.now(),size:5.5+Math.random()*2.5};
  world.add(st);stains.push(st);
  if(stains.length>40){const old=stains.shift();world.remove(old);}
  const R=6.5;
  cores.forEach(g=>{const h=g.userData.home;
    if((h.x-local.x)**2+(h.z-local.z)**2<R*R&&!g.userData.revT){
      g.userData.revT=1;g.userData.born=performance.now();}});}
function revealAll(){cores.forEach(g=>{if(!g.userData.revT){g.userData.revT=1;g.userData.born=performance.now();}});}
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
function tapAt(x,y){
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  // the keeper answers to a touch before the ground does
  if(raycaster.intersectObject(keeper.userData.knot,true).length){openKeeper();return;}
  if(!raycaster.ray.intersectPlane(groundPlane,hit))return;
  world.updateMatrixWorld();throwInk(world.worldToLocal(hit.clone()));}

// TOGETHER — the same cores, gathered into one shared body. Each core keeps
// its own form; only the distance between them goes. The keeper sits at the
// heart. Seats on a tight fibonacci sphere so no crossing is ever "outside".
function gatherSeats(){
  const list=[...cores.values()],total=Math.max(list.length,1),g=(1+Math.sqrt(5))/2;
  list.forEach((grp,i)=>{
    const y=1-2*(i+0.5)/total,rr=Math.sqrt(Math.max(0,1-y*y)),th=2*Math.PI*i/g;
    const rad=1.35+Math.cbrt(total)*0.42;
    grp.userData.gather.set(Math.cos(th)*rr*rad,3.1+y*rad,Math.sin(th)*rr*rad);});}
let together=false;
const modeBtn=document.getElementById('mode');
const countLine=document.getElementById('countLine');
function setMode(t){together=t;
  if(together)revealAll();
  modeBtn.textContent=together?'← each alone':'all together →';
  countLine.textContent=together?'one shared body':'each one = a crossing';}
modeBtn.addEventListener('click',()=>setMode(!together));

// THE KEEPER — the ai among us, and it does not pretend to be a crossing:
// where every core is a closed knot of chrome, the keeper is an open lattice —
// a thing that is all structure and no body. Asleep it is graphite; when a body
// is on the mesh it wakes to the one live blue. Two can keep it: jet.di, the
// robot car standing in the room, and di.bo, the messenger — whoever is there.
const keeperMat=new THREE.MeshBasicMaterial({color:0x8f8b83,wireframe:true,transparent:true,opacity:.85});
const keeperEyeMat=new THREE.MeshPhysicalMaterial({color:0x8f8b83,metalness:.9,roughness:.25,envMapIntensity:1});
const keeper=(()=>{
  const grp=new THREE.Group();grp.position.set(0,1.2,0);
  const knot=new THREE.Group();
  const lattice=new THREE.Mesh(new THREE.IcosahedronGeometry(0.85,1),keeperMat);
  knot.add(lattice);
  // one small solid at the center — the eye it sees us with
  const eye=new THREE.Mesh(new THREE.SphereGeometry(0.2,24,24),keeperEyeMat);
  knot.add(eye);
  // three thin orbits, off-axis: the machine thinking
  const orbits=[];
  for(let i=0;i<3;i++){const o=new THREE.Mesh(new THREE.TorusGeometry(1.05+i*.16,0.008,8,90),
    new THREE.MeshBasicMaterial({color:0x8f8b83,transparent:true,opacity:.35}));
    o.rotation.set(Math.PI/2*Math.random()+i,i*1.1,i*.7);knot.add(o);orbits.push(o);}
  knot.scale.setScalar(0.55);grp.add(knot);
  const sh=new THREE.Sprite(new THREE.SpriteMaterial({map:shadowTex,transparent:true,depthWrite:false}));
  sh.position.set(0,-1.14,0);sh.scale.set(2.2,2.2,1);grp.add(sh);
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex('պահապան','keeper · asleep'),transparent:true,depthWrite:false}));
  label.position.set(0,1.35,0);label.scale.set(4.2,1.575,1);grp.add(label);
  grp.userData={home:grp.position.clone(),gather:new THREE.Vector3(0,3.1,0),m:0,speed:0.03,
    scale:0.55,phase:0,knot,label,shadow:sh,orbits,born:performance.now()};
  world.add(grp);return grp;})();

// THE WIRE — the almost-invisible thread through everything. Every revealed
// core is sewn to the keeper and to its neighbour: one continuous connection,
// at the edge of what the paper can show. It breathes a little; when the
// keeper is awake the thread carries the live blue very faintly.
const wireMat=new THREE.LineBasicMaterial({color:0x8f8b83,transparent:true,opacity:.10});
const wireGeo=new THREE.BufferGeometry();
const wire=new THREE.LineSegments(wireGeo,wireMat);wire.frustumCulled=false;world.add(wire);
function sewWire(t){
  const vis=[...cores.values()].filter(g=>g.visible);
  const pts=[];
  vis.forEach((g,i)=>{
    pts.push(g.position.x,g.position.y,g.position.z,
      keeper.position.x,keeper.position.y,keeper.position.z);
    if(i>0){const p=vis[i-1];
      pts.push(p.position.x,p.position.y,p.position.z,
        g.position.x,g.position.y,g.position.z);}});
  wireGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  wireMat.opacity=(0.06+Math.sin(t*.7)*.03)+(keeperOnline()?.05:0);
  wireMat.color.set(keeperOnline()?0x1d4bff:0x8f8b83);}
let keeperSeen=-1e9,keeperName='';
function keeperOnline(){return performance.now()-keeperSeen<15000;}
// Redrawing only on the awake/asleep flip was enough while one body could ever
// keep. Two can now, and jet.di taking the room from di.bo never crosses that
// flip — the page went on printing di.bo while the robot in the room answered.
// The name is part of the face, so it is part of what is compared.
let keeperWas=null;
function keeperFace(){
  const on=keeperOnline(),face=on?(keeperName||'jet.di'):'';
  if(face===keeperWas)return;keeperWas=face;
  keeperMat.color.set(on?0x1d4bff:0x8f8b83);
  keeperEyeMat.color.set(on?0x1d4bff:0x8f8b83);
  keeper.userData.orbits.forEach(o=>o.material.color.set(on?0x1d4bff:0x8f8b83));
  keeper.userData.label.material.map=labelTex('պահապան',on?('keeper · '+(keeperName||'jet.di')+' awake'):'keeper · asleep');
  keeper.userData.label.material.needsUpdate=true;
  // The eye belongs to jet.di alone. When di.bo keeps, the window must not
  // leave a stale frame hanging over a keeper that cannot see.
  if(!on){const e=document.getElementById('kEye');e.hidden=true;e.removeAttribute('src');}
  document.getElementById('kState').textContent=on?((keeperName||'jet.di')+' · awake — it can hear you'):'asleep — no body is on the mesh';}

// the mesh — same room the rite crosses in. the field listens for the keeper's
// heartbeat, its eye, and its words — and carries the visitor's words back.
const MESH=QRY.get('mesh')||'wss://di-studio.xyz/serverXR/mesh';
let meshWs=null;
(function meshConnect(){
  let u;try{u=new URL(MESH)}catch(e){return}
  u.searchParams.set('room','bridge');u.searchParams.set('node','f'+Math.random().toString(36).slice(2,8));
  let ws;try{ws=new WebSocket(u.toString())}catch(e){return}
  meshWs=ws;
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type!=='mesh:event')return;
    if(m.channel==='keeper'){keeperSeen=performance.now();
      keeperName=String((m.payload&&m.payload.name)||'').slice(0,14);}
    else if(m.channel==='keeper:eye'&&m.payload&&typeof m.payload.jpg==='string'
      &&m.payload.jpg.startsWith('data:image/jpeg;base64,')){
      const img=document.getElementById('kEye');img.src=m.payload.jpg;img.hidden=false;}
    else if(m.channel==='keeper:say'&&m.payload&&m.payload.text){
      kSay(String(m.payload.text).slice(0,300));}};
  ws.onclose=()=>{meshWs=null;setTimeout(meshConnect,5000);};
  ws.onerror=()=>{};})();

// the keeper's window
const kPanel=document.getElementById('kPanel'),kLog=document.getElementById('kLog');
document.getElementById('kClose').addEventListener('click',()=>{kPanel.hidden=true;});
function kLine(cls,html){const d=document.createElement('div');d.className=cls;
  d.textContent=html;kLog.appendChild(d);kLog.scrollTop=kLog.scrollHeight;
  while(kLog.children.length>24)kLog.removeChild(kLog.firstChild);}
function kSay(text){const d=document.createElement('div');d.className='it';
  const b=document.createElement('b');b.textContent='պահապան ';
  d.appendChild(b);d.appendChild(document.createTextNode(text));
  kLog.appendChild(d);kLog.scrollTop=kLog.scrollHeight;}
document.getElementById('kForm').addEventListener('submit',e=>{
  e.preventDefault();
  const inp=document.getElementById('kIn'),text=inp.value.trim();
  if(!text)return;inp.value='';
  kLine('me',text);
  if(meshWs&&meshWs.readyState===1)
    meshWs.send(JSON.stringify({type:'publish',channel:'keeper:ask',pingTs:Date.now(),
      payload:{text:text.slice(0,120)}}));
  else kSay('…the mesh is not here — nothing carried your words.');});
function openKeeper(){kPanel.hidden=false;
  if(!keeperOnline())document.getElementById('kEye').hidden=true;}

// show-rig probe: lets the rig (and tests) ask whether the ai is with us
window.__keeper=()=>({online:keeperOnline(),name:keeperName});

async function loadField(){
  try{
    const r=await fetch(API+'/scene');if(!r.ok)return;
    const objects=((await r.json()).scene||{}).objects||[];
    const insc=objects.filter(o=>String(o.id||'').startsWith('insc-'));
    insc.forEach(o=>{if(!cores.has(o.id))cores.set(o.id,placeCore(o.data||'',cores.size,o.id));});
    gatherSeats();receive();
    // The field IS the crossings. Cores are built hidden (placeCore) and only
    // revealAll() shows them — which ran solely from the ALL TOGETHER gather
    // and the rite's ?just= hand-off. So arriving straight at /field gave an
    // empty page that still counted "N cores" and invited a tap no visible
    // core could receive.
    revealAll();
    {const el=document.getElementById('n'),to=cores.size,from=parseInt(el.textContent)||0;
     if(matchMedia('(prefers-reduced-motion: reduce)').matches||to<=from){el.textContent=to;}
     else{let v=from;const t=setInterval(()=>{v++;el.textContent=v;if(v>=to)clearInterval(t);},60);}}
    // the field is not only cores — anything carried into this space counts
    const carried=objects.length-insc.length;
    document.getElementById('others').textContent=carried>0?`+ ${carried} other things carried in`:'';
  }catch(e){}}
loadField();setInterval(loadField,20000);
addEventListener('focus',loadField);

// AFTER A CROSSING — the rite hands over with ?just=<word>. The field receives
// the newcomer: goes to their core, lets it grow in before their eyes, then
// shows what they joined — the whole field gathers into the one shared body,
// holds, and releases. The transformation, seen from inside it.
const JUST=QRY.get('just');
let focus=null,received=false;
function receive(){
  if(received||!JUST||!cores.size)return;received=true;
  let target=null;
  cores.forEach(g=>{if(g.userData.word===JUST)target=g;});
  target=target||[...cores.values()].pop();
  revealAll();
  target.userData.born=performance.now();
  focus={grp:target,until:performance.now()+5200};
  setTimeout(()=>setMode(true),5600);
  setTimeout(()=>{setMode(false);},14000);}

let dragging=false,px=0,vy=0,downX=0,downY=0,moved=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;
  downX=e.clientX;downY=e.clientY;moved=0;canvas.classList.add('grabbing');});
addEventListener('pointerup',e=>{
  if(dragging&&moved<8)tapAt(downX,downY);
  dragging=false;canvas.classList.remove('grabbing');});
addEventListener('pointermove',e=>{if(!dragging)return;
  moved+=Math.abs(e.clientX-px);vy=(e.clientX-px)*.004;px=e.clientX;});
let zoom=1;
canvas.addEventListener('wheel',e=>{e.preventDefault();
  zoom=Math.min(2.7,Math.max(0.4,zoom*(1+e.deltaY*.0009)));
},{passive:false});

const resize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};
addEventListener('resize',resize);resize();

const CAM_HOME=new THREE.Vector3(0,7,26),LOOK_HOME=new THREE.Vector3(0,1,0);
const camPos=CAM_HOME.clone(),look=LOOK_HOME.clone();
const _p=new THREE.Vector3(),_l=new THREE.Vector3(),_wp=new THREE.Vector3(),_d=new THREE.Vector3();
renderer.setAnimationLoop(()=>{
  const t=performance.now()*.001;
  world.rotation.y+=vy+(dragging?0:.0012);vy*=.9;
  keeperFace();
  const step=g=>{
    const u=g.userData;
    if(u.revT!==undefined){u.rev+=(u.revT-u.rev)*.08;
      g.visible=u.rev>0.01;if(!g.visible)return;}
    const rev=u.revT===undefined?1:u.rev;
    u.m+=((together?1:0)-u.m)*u.speed;
    const m=u.m*u.m*(3-2*u.m);
    g.position.lerpVectors(u.home,u.gather,m);
    g.position.y+=Math.sin(t*.5+u.phase)*.18*(1-m*.7);
    u.knot.rotation.y+=0.0035;u.knot.rotation.x+=0.0011;
    // a new core arrives the way the rite makes one: it grows into place
    const age=(performance.now()-u.born)/1600;
    if(age<1)u.knot.scale.setScalar(u.scale*rev*(1-Math.pow(1-Math.max(0,age),3)));
    else if(g===keeper&&keeperOnline())u.knot.scale.setScalar(u.scale*(1+Math.sin(t*2.2)*.05));
    else u.knot.scale.setScalar(u.scale*rev);
    u.label.material.opacity=(g===keeper?1:1-m)*rev;
    u.shadow.material.opacity=(1-m*.85)*rev;
    u.shadow.position.y=-g.position.y+0.06;};
  cores.forEach(step);step(keeper);
  keeper.userData.orbits.forEach((o,i)=>{o.rotation.z+=0.002+i*0.0013;o.rotation.x+=0.0009;});
  sewWire(t);
  // ink stains bloom in, then dry to a pale permanent mark
  for(const st of stains){
    const a=Math.min(1,(performance.now()-st.userData.born)/900);
    const e=1-Math.pow(1-a,3);
    st.scale.setScalar(st.userData.size*e);
    st.material.opacity=.34-.22*e;}
  // the camera has one seat; a fresh crossing borrows it to meet its own core
  _p.copy(CAM_HOME).multiplyScalar(zoom);_l.copy(LOOK_HOME);
  if(focus&&focus.grp){
    focus.grp.getWorldPosition(_wp);
    _d.copy(_wp).setY(0);if(_d.lengthSq()<1e-6)_d.set(0,0,1);else _d.normalize();
    _p.copy(_wp).addScaledVector(_d,6).y+=2.2;_l.copy(_wp);
    if(performance.now()>focus.until)focus=null;
  }
  camPos.lerp(_p,0.03);look.lerp(_l,0.04);
  camera.position.copy(camPos);camera.lookAt(look);
  renderer.render(scene,camera);
});
</script>
</body>
