<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>br_id_ge XR_ Notations:vi.ritual — the rite</title>
<meta name="description" content="br_id_ge (կամուրջ) — a rite in five acts. The lamp reads your outline into Armenian letters; answer the Keeper, and your crossing becomes a core that stays. Nothing is recorded — only your name and one word cross.">
<!-- Live co-presence + the permanent field — the rite is communal since 2026-07-13. -->
<meta name="mesh-url" content="wss://di-studio.xyz/serverXR/mesh">
<meta name="field-url" content="https://di-studio.xyz/serverXR/api/spaces/br_id_ge">
<!-- The keeper — local LLM, layer 1 of the installation. Uncomment on the show rig
     (or pass ?keeper=http://127.0.0.1:11434&keeperModel=dob-fast). Rite never blocks on it.
<meta name="keeper-url" content="http://127.0.0.1:11434">
<meta name="keeper-model" content="dob-fast"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@300;400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* ONE ground, ONE ink, ONE dim. No accent until the core, which is the only solid
   form in the piece. The previous version stacked twenty-two simultaneous layers —
   three noise fields, three pointer marks, six text layers — and no palette could
   fix that. This is the edit, not a repaint. */
:root{
  --ground:#000; --ink:#f2efe9; --dim:#5f5952; --faint:#2a2724;
  --arm:'Noto Serif Armenian',Georgia,serif;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
/* The rite is drag-driven, and on a phone dragging down is the browser's reload
   gesture — so reading your own outline reloaded the page. overflow:hidden does not
   stop overscroll; overscroll-behavior and touch-action do. */
html,body{height:100%;overflow:hidden;background:var(--ground);
  overscroll-behavior:none;touch-action:none;-webkit-overflow-scrolling:auto}
body{color:var(--ink);font-family:var(--mono);cursor:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* the one element that must still accept native touch */
.ask input{touch-action:auto;-webkit-user-select:text;user-select:text}

/* LAYER 1 — the reading */
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}

/* LAYER 2 — the words */
#type{position:fixed;inset:0;z-index:2;display:grid;place-items:center;
  padding:max(1.5rem,env(safe-area-inset-top)) 1.5rem;pointer-events:none;text-align:center}
#type>*{grid-area:1/1;opacity:0;transition:opacity .9s ease}
#type>.on{opacity:1}

.card .arm{font-family:var(--arm);font-weight:300;font-size:clamp(2.1rem,9vw,4.4rem);
  line-height:1;letter-spacing:.02em}
.card .lat{font-family:var(--mono);font-size:.62rem;letter-spacing:.44em;
  text-transform:uppercase;color:var(--dim);margin-top:1.5rem}

.ask{display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
.ask.on{pointer-events:auto}
.ask .q{font-family:var(--arm);font-weight:300;font-size:clamp(1.5rem,5.4vw,2.5rem);
  line-height:1.25;max-width:22ch}
.ask .sub{font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--dim);margin-top:1.1rem}
.ask input{margin-top:2.6rem;background:none;border:0;border-bottom:1px solid var(--faint);
  color:var(--ink);font-family:var(--arm);font-weight:300;font-size:clamp(1.6rem,6vw,2.6rem);
  text-align:center;width:min(90vw,26ch);padding:.2rem 0 .5rem;outline:none;caret-color:var(--ink)}
.ask input::placeholder{color:var(--faint)}
.ask input:focus{border-bottom-color:var(--dim)}
.ask .go{font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--faint);margin-top:1.3rem}

/* anchored low: the core occupies the middle of the frame, and the words must not
   sit on top of it */
.end{display:flex;flex-direction:column;align-items:center;gap:1.4rem;
  align-self:end;justify-self:center;padding-bottom:clamp(3rem,11vh,7rem)}
.end .said{font-family:var(--arm);font-weight:300;font-size:clamp(1.1rem,3.6vw,1.6rem);
  line-height:1.45;max-width:26ch;color:var(--ink)}
.end .note{font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;line-height:1.9;
  color:var(--dim);max-width:34ch;text-transform:lowercase}
.end .again{font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--faint);padding-bottom:.3rem;
  pointer-events:auto;cursor:pointer;text-decoration:none}
.end .again:hover,.end .again:focus-visible{color:var(--ink);border-bottom-color:var(--dim)}

/* LAYER 3 — one status line, bottom left. Nothing else. */
/* right-hand side: the di.iiii viewer overlays its own badge bottom-left */
#state{position:fixed;z-index:3;right:0;bottom:0;
  padding:1.1rem max(1.1rem,env(safe-area-inset-right));
  font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);
  pointer-events:none;display:flex;gap:1.4rem;justify-content:flex-end;text-align:right}
#state b{font-weight:400;color:var(--dim)}

/* the door */
#door{position:fixed;inset:0;z-index:9;background:var(--ground);display:grid;place-items:center;
  padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:opacity 1.1s ease}
#door.gone{opacity:0;pointer-events:none}
#door .w{font-family:var(--arm);font-weight:300;font-size:clamp(2.6rem,12vw,5.5rem);line-height:1}
#door .t{font-family:var(--mono);font-size:.6rem;letter-spacing:.3em;line-height:2.2;
  color:var(--dim);max-width:40ch;margin-top:2.2rem;text-transform:lowercase}
#door .t em{font-style:normal;color:var(--ink)}
#door .p{font-family:var(--mono);font-size:.52rem;letter-spacing:.16em;color:var(--faint);
  margin-top:2rem;line-height:1.9;text-transform:lowercase}

@media (prefers-reduced-motion:reduce){#type>*{transition:none}#door{transition:none}}
@media (pointer:coarse){body{cursor:auto}}
@media (max-width:560px){
  #state{flex-direction:column;align-items:flex-end;gap:.4rem;font-size:.52rem}
  #door .t{letter-spacing:.2em;line-height:2}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="type">
  <div class="card" id="card"><div class="arm"></div><div class="lat"></div></div>
  <div class="ask" id="ask">
    <div class="q"></div><div class="sub"></div>
    <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
    <div class="go">press enter</div>
  </div>
  <div class="end" id="end">
    <div class="said"></div>
    <div class="note"></div>
    <a class="again" id="again" href="#">cross again</a>
  </div>
</div>

<div id="state">
  <span><b id="sRead">0</b> read</span>
  <span><b id="sField">0</b> in the field</span>
  <span id="sHere" hidden><b id="sHereN">0</b> here now</span>
  <span id="sLamp">lamp closed</span>
</div>

<div id="door">
  <div>
    <div class="w arm">կամուրջ</div>
    <div class="t">a bridge between the real world and a shared one.<br>
      the lamp reads your outline into letters. answer once.<br>
      <em>touch to open the lamp</em></div>
    <div class="p">nothing is recorded · no image leaves this device<br>only your name and one word cross</div>
  </div>
</div>

<script type="module">
const $=(s)=>document.querySelector(s)
const clamp=(v,a,b)=>v<a?a:(v>b?b:v)
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches
const Q=new URLSearchParams(location.search)

// ── the alphabet. Armenian letterforms and Armenian punctuation only. ──────
const GLYPHS=[...'ԱԲԳԴԵԶԷԸԹԺԻԼԽԾԿՀՁՂՃՄՅՆՇՈՉՊՋՌՍՎՏՐՑՒՓՔՕՖ']

// ── canvas ────────────────────────────────────────────────────────────────
const cv=$('#c'),ctx=cv.getContext('2d')
let W=0,H=0,DPR=1
function resize(){
  DPR=Math.min(2,devicePixelRatio||1)
  W=innerWidth;H=innerHeight
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)
  ctx.setTransform(DPR,0,0,DPR,0,0)
  fitFigure()
}
addEventListener('resize',resize)

// ── the figure. A grid only used to find the OUTLINE — never to fill it. ──
// This is the whole difference: the body is a contour of letters, not a mass of
// them. 96x54 cells yield a few hundred edge points, where the old shell drew
// 2304 points every frame whether they meant anything or not.
const GW=96,GH=54
const bodyMask=new Uint8Array(GW*GH)
let figW=0.26,figH=0.40,figY=0.50
// STEP thins the outline on narrow screens: at 96 columns across a phone the cells
// are ~4px apart while a letter is ~13px, so every glyph collided with its
// neighbours. FS keeps the letter proportional to the space it actually has.
let STEP=1,FS=13
function fitFigure(){
  const a=W/Math.max(1,H)
  figW=a<0.75?0.20:(a<1.2?0.24:0.17)
  figH=a<0.75?0.34:0.40
  STEP=W<560?2:1
  FS=clamp((W/GW)*STEP*1.35,10,17)
}

// memory mode — no camera (every visitor inside the sandboxed viewer). A standing
// figure, breathing. Same language as the lit version so the piece reads the same.
function dreamed(i,j,t){
  const x=(i/(GW-1)-0.5),y=j/(GH-1)
  const br=1+0.02*Math.sin(t*0.7)
  const cy=figY
  const torso=Math.pow(x/(figW*br),2)+Math.pow((y-cy)/(figH*br),2)
  const head=Math.pow(x/(figW*0.42),2)+Math.pow((y-(cy+figH*0.92))/(figH*0.26),2)
  const arms=Math.pow((Math.abs(x)-figW*0.96)/(figW*0.26),2)+Math.pow((y-(cy+figH*0.12))/(figH*0.62),2)
  return Math.min(torso,head,arms)<1?1:0
}

// ── the outline, and the letters that live on it ──────────────────────────
// Each edge cell holds one glyph. Unread it is a faint point; read it is a letter.
// Nothing else is ever drawn.
// A live camera moves the mask edge every frame. The first version kept every cell
// that had EVER been an edge, so a real body walking around accreted into a solid
// mass of letters — 1156 of them in a minute. The outline must TRACK the body:
// unread points belong to the current edge only. Read letters persist, because they
// are what the lamp has taken, but they are capped so the screen can never fill.
const marks=new Map()    // cellIndex -> {i,j,g,read,t}
const MAX_READ=300
function rebuildOutline(t){
  const cur=new Set()
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    const k=j*GW+i
    if(!bodyMask[k])continue
    const l=i>0?bodyMask[k-1]:0, r=i<GW-1?bodyMask[k+1]:0
    const u=j>0?bodyMask[k-GW]:0, d=j<GH-1?bodyMask[k+GW]:0
    if(l&&r&&u&&d)continue
    if(STEP>1&&((i%STEP)||(j%STEP)))continue
    cur.add(k)
    if(!marks.has(k))marks.set(k,{i,j,g:GLYPHS[(Math.random()*GLYPHS.length)|0],read:0,t:0})
  }
  let readCount=0
  for(const [k,m] of marks){
    if(m.read){readCount++;continue}
    if(!cur.has(k))marks.delete(k)          // the body moved on
  }
  // oldest read letters give way, so the reading stays a contour and never a field
  if(readCount>MAX_READ){
    let over=readCount-MAX_READ
    for(const [k,m] of marks){
      if(!m.read)continue
      marks.delete(k)
      if(--over<=0)break
    }
  }
}
function markScreen(m){
  // the grid is mirrored in x: a front camera shows you your reflection
  return [ (1-(m.i+0.5)/GW)*W, ((m.j+0.5)/GH)*H ]
}

// ── the lamp: camera in, outline out ─────────────────────────────────────
const CAM_FACING=Q.get('cam')||'user'
let video=null,camOn=false
async function openLamp(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:CAM_FACING,width:{ideal:640},height:{ideal:360}},audio:false})
    video=document.createElement('video');video.srcObject=s;video.muted=true
    video.setAttribute('playsinline','');await video.play();camOn=true
    $('#sLamp').textContent='lamp open'
    openSeg()
  }catch(e){ $('#sLamp').textContent='lamp closed — the bridge remembers for you' }
}

// MediaPipe, entirely optional: without it (no GPU, no CDN, ?body=0) the dreamed
// figure stands in and every mechanic behaves identically.
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'
let seg=null,segAt=0
async function openSeg(){
  if(Q.get('body')==='0')return
  try{
    const v=await import(MP+'/vision_bundle.mjs')
    const files=await v.FilesetResolver.forVisionTasks(MP+'/wasm')
    seg=await v.ImageSegmenter.createFromOptions(files,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite',delegate:'GPU'},
      runningMode:'VIDEO',outputCategoryMask:true,outputConfidenceMasks:false})
    $('#sLamp').textContent='lamp open — it sees you'
  }catch(e){seg=null}
}
function readSeg(now){
  if(!seg||!camOn||!video||video.readyState<2)return false
  if(now-segAt<80)return true
  segAt=now
  try{ seg.segmentForVideo(video,now,(res)=>{
    const m=res&&res.categoryMask; if(!m){res&&res.close&&res.close();return}
    const w=m.width,h=m.height,d=m.getAsUint8Array()
    for(let j=0;j<GH;j++){const sy=Math.min(h-1,((j+0.5)/GH*h)|0)
      for(let i=0;i<GW;i++){const sx=Math.min(w-1,((i+0.5)/GW*w)|0)
        bodyMask[j*GW+i]=d[sy*w+sx]>0?1:0}}
    m.close&&m.close();res.close&&res.close()
  })}catch(e){}
  return true
}

// ── where you are pointing ───────────────────────────────────────────────
const P={x:-999,y:-999,has:false}
function point(x,y){P.x=x;P.y=y;P.has=true}
addEventListener('pointermove',e=>{if(!hand.has)point(e.clientX,e.clientY)},{passive:true})
addEventListener('pointerdown',e=>{if(!hand.has)point(e.clientX,e.clientY)},{passive:true})
// belt and braces for the reload gesture: some Android builds still overscroll a
// fixed body. The input keeps its own touch handling so typing is unaffected.
addEventListener('touchmove',e=>{
  if(e.target&&e.target.tagName==='INPUT')return
  e.preventDefault()
},{passive:false})

// the hand, if MediaPipe can find one. Confirmed working on device 2026-07-30.
const hand={has:false,x:0,y:0}
let hl=null,hlAt=0
async function openHands(){
  if(Q.get('hands')==='0')return
  try{
    const v=await import(MP+'/vision_bundle.mjs')
    const files=await v.FilesetResolver.forVisionTasks(MP+'/wasm')
    hl=await v.HandLandmarker.createFromOptions(files,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},
      numHands:1,runningMode:'VIDEO'})
  }catch(e){hl=null}
}
function readHand(now){
  if(!hl||!camOn||!video||video.readyState<2)return
  if(now-hlAt<40)return
  hlAt=now
  let r;try{r=hl.detectForVideo(video,now)}catch(e){return}
  const lm=r&&r.landmarks&&r.landmarks[0]
  if(!lm){hand.has=false;return}
  hand.has=true
  const tx=(1-lm[9].x)*W, ty=lm[9].y*H
  hand.x=hand.x?hand.x+(tx-hand.x)*0.3:tx
  hand.y=hand.y?hand.y+(ty-hand.y)*0.3:ty
  point(hand.x,hand.y)
}

// ── the liturgy. Unchanged: five acts, two questions, the same thresholds. ─
const ACTS=[
  {arm:'ԴՌՆԵՐ',       lat:'threshold · act i',   at:0.001},
  {arm:'ԱՆՑՈՒՄ',      lat:'the crossing · act ii', at:0.10},
  {arm:'ՎԿԱ',         lat:'the witness · act iii', at:0.45},
  {arm:'ՆՈԹԱԳՐՈՒԹՅՈՒՆ',lat:'notation · act iv',    at:0.80},
]
const KEEPER_AT=0.45, INSCRIBE_AT=0.80
let act=-1, started=false, readN=0, target=1, name='', word='', done=false
let asking=null, inscribed=false, condense=0

const card=$('#card'), ask=$('#ask'), end=$('#end'), input=$('#in')
function show(el){for(const n of $('#type').children)n.classList.toggle('on',n===el)}
// The act titles and the questions share one exclusive layer, and two acts land on
// the exact thresholds that open the questions (iii/0.45 with the name, iv/0.80 with
// the word). Without this the title closed the question the moment it opened and the
// rite could never be finished. The title plays first; the question follows it.
let cardUntil=0
function showCard(a){
  card.querySelector('.arm').textContent=a.arm
  card.querySelector('.lat').textContent=a.lat
  cardUntil=performance.now()+2800
  show(card)
  clearTimeout(showCard._t)
  showCard._t=setTimeout(()=>{if(!asking&&!done)show(null)},2600)
}
function frac(){return clamp(readN/target,0,1)}

// ── the keeper — a local LLM if one is running, scripted lines if not ─────
const KEEPER_URL=(Q.get('keeper')||($('meta[name="keeper-url"]')||{}).content||'').replace(/\/+$/,'')
const KEEPER_MODEL=Q.get('keeperModel')||($('meta[name="keeper-model"]')||{}).content||'dob-fast'
const KEEPER_SYS='You are ՎԿԱ, the Keeper of Memory on կամուրջ, the bridge of Armenian letters between the real world and a shared digital one. Reply with exactly ONE line in English, at most 16 words, spare and warm like a carved inscription. You may include at most one Armenian word. No emoji, no quotes, no questions, no explanations.'
function askKeeper(prompt){
  if(!KEEPER_URL)return Promise.resolve('')
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),9000)
  return fetch(KEEPER_URL+'/api/generate',{method:'POST',signal:ctl.signal,
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:KEEPER_MODEL,system:KEEPER_SYS,prompt,stream:false,think:false,
      options:{temperature:0.7,num_predict:64}})})
    .then(r=>r.json()).then(d=>{
      clearTimeout(t)
      let s=String(d.response||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim()
      s=s.split('\n').map(x=>x.trim()).filter(Boolean)[0]||''
      s=s.replace(/^["'“”«]+|["'“”»]+$/g,'').replace(/^(ՎԿԱ|VKA|keeper|the keeper)\s*[:·—-]\s*/i,'')
      if(d.done_reason==='length'){
        const cut=Math.max(s.lastIndexOf('։'),s.lastIndexOf('.'),s.lastIndexOf('!'),s.lastIndexOf('…'),s.lastIndexOf(','))
        s=cut>12?s.slice(0,cut+1).replace(/,$/,'…'):s.slice(0,s.lastIndexOf(' '))+'…'
      }
      return s.slice(0,180)
    }).catch(()=>{clearTimeout(t);return ''})
}

// ── the field ─────────────────────────────────────────────────────────────
const FIELD_URL=(Q.get('field')||($('meta[name="field-url"]')||{}).content||'').replace(/\/+$/,'')
let field=[];try{field=JSON.parse(localStorage.getItem('br_id_ge_field')||'[]')}catch(e){field=[]}
$('#sField').textContent=field.length
if(FIELD_URL){
  fetch(FIELD_URL+'/scene').then(r=>r.json()).then(j=>{
    const objs=j.objects||(j.scene&&j.scene.objects)||[]
    const remote=objs.filter(o=>String(o.id||'').startsWith('insc-')).map(o=>String(o.data||''))
    for(const tag of remote)if(tag&&!field.includes(tag))field.push(tag)
    $('#sField').textContent=field.length
  }).catch(()=>{})
}

// ── co-presence. Protocol untouched; peers are one faint point each. ──────
const MESH_URL=Q.get('mesh')||($('meta[name="mesh-url"]')||{}).content||''
const myNode='n'+Math.random().toString(36).slice(2,8)
const Mesh={ws:null,live:false,peers:new Map(),lastSend:0,
  connect(){
    if(!MESH_URL)return
    let u;try{u=new URL(MESH_URL)}catch(e){return}
    u.searchParams.set('room','bridge');u.searchParams.set('node',myNode)
    let ws;try{ws=new WebSocket(u.toString())}catch(e){return}
    this.ws=ws
    ws.onopen=()=>{this.live=true}
    ws.onclose=()=>{this.live=false;this.peers.clear();this.count()}
    ws.onerror=()=>{}
    ws.onmessage=(ev)=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}this.handle(m)}
  },
  handle(m){
    if(m.type==='peer:leave'){this.peers.delete(m.nodeId);this.count();return}
    if(m.type==='mesh:event'&&m.channel==='motion'){
      const p=(m.meta&&m.meta.predicted)||m.payload||{}
      let pr=this.peers.get(m.from)
      if(!pr){pr={x:0.5,y:0.5,name:'',seen:0};this.peers.set(m.from,pr)}
      if(typeof p.u==='number'){pr.x=p.u;pr.y=p.v}
      if(m.payload&&m.payload.name)pr.name=String(m.payload.name).slice(0,18)
      pr.seen=performance.now();this.count()
    }
  },
  send(u,v,f){
    if(!(this.ws&&this.live&&this.ws.readyState===1))return
    const now=performance.now();if(now-this.lastSend<100)return
    this.lastSend=now
    this.ws.send(JSON.stringify({type:'publish',channel:'motion',pingTs:Date.now(),
      payload:{u,v,x:u*20-10,y:v*-10+5,z:-20,name:(name||'').slice(0,18),p:f}}))
  },
  sweep(){for(const[id,pr]of this.peers)if(performance.now()-pr.seen>9000)this.peers.delete(id);this.count()},
  count(){
    const n=this.peers.size
    $('#sHere').hidden=n===0
    $('#sHereN').textContent=n
    return n
  }
}
Mesh.connect()

// ── acts ──────────────────────────────────────────────────────────────────
function advance(){
  const f=frac()
  for(let i=ACTS.length-1;i>=0;i--){
    if(f>=ACTS[i].at&&act<i){act=i;if(!asking)showCard(ACTS[i]);break}
  }
  if(asking||done||performance.now()<cardUntil)return
  if(!name&&f>=KEEPER_AT)openAsk('name')
  else if(name&&!word&&f>=INSCRIBE_AT)openAsk('word')
}
function openAsk(kind){
  asking=kind
  const q=ask.querySelector('.q'),sub=ask.querySelector('.sub')
  if(kind==='name'){
    q.textContent='Ո՞վ ես դու։'
    sub.textContent='who are you'
    input.placeholder='ձեր անունը · your name'
  }else{
    q.textContent='Ի՞նչ ես բերում։'
    sub.textContent='what do you carry across'
    input.placeholder='մեկ բառ · one word'
  }
  input.value=''
  show(ask)
  setTimeout(()=>input.focus(),260)
}
function submit(){
  const v=input.value.trim()
  if(!v)return
  if(asking==='name'){
    name=v.slice(0,40);asking=null;show(null)
    askKeeper('The visitor gives their name: '+name+'. Greet them in one line as they cross the bridge.')
      .then(l=>{if(l&&!done)said(l)})
  }else{
    word=v.slice(0,60);asking=null;inscribe()
  }
}
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}})

function said(line){
  end.querySelector('.said').textContent=line
  end.querySelector('.note').textContent=''
  show(end)
  clearTimeout(said._t)
  said._t=setTimeout(()=>{if(!done)show(null)},7000)
}

// ── the core ──────────────────────────────────────────────────────────────
function inscribe(){
  inscribed=true;done=true
  const tag=(name||'—')+' · '+word
  field.push(tag)
  try{localStorage.setItem('br_id_ge_field',JSON.stringify(field.slice(-80)))}catch(e){}
  $('#sField').textContent=field.length

  const others=field.length-1
  end.querySelector('.said').textContent=
    (Mesh.count()>0?'the bridge answers. ':'')+
    'your word joins '+others+' before you.'
  end.querySelector('.note').textContent=''
  show(end)

  // The rite never blocks on the network — but it no longer claims a permanence
  // it did not achieve. Silence here is what hid nine days of refused crossings.
  if(FIELD_URL){
    fetch(FIELD_URL+'/inscriptions',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name||'—',word})})
      .then(r=>{if(!r.ok)throw new Error(String(r.status))})
      .catch(()=>{end.querySelector('.note').textContent=
        'the far field did not answer — your core stays here, on this device, and has not yet joined the others.'})
  }
  askKeeper('The visitor has crossed. Their name: '+(name||'a nameless one')+'. They carried the word: '+word+
    '. Their outline became a core, joining '+others+' before them. Bless it in one line.')
    .then(l=>{if(l)end.querySelector('.said').textContent=l})
}
$('#again').addEventListener('click',e=>{e.preventDefault();location.reload()})

// ── the door ──────────────────────────────────────────────────────────────
const door=$('#door')
function begin(){
  if(started)return
  started=true
  door.classList.add('gone')
  openLamp().then(openHands)
  showCard(ACTS[0])
}
door.addEventListener('click',begin)
door.addEventListener('touchend',e=>{e.preventDefault();begin()},{passive:false})

// ── draw ──────────────────────────────────────────────────────────────────
// Three things reach the screen: unread points, read letters, and — at the end —
// the core. That is the entire visual vocabulary.
const t0=performance.now()
let coreCX=0,coreCY=0,coreR=0,quiet=1

function frame(now){
  const t=(now-t0)/1000
  readHand(now)
  const lit=readSeg(now)
  if(!lit||!camOn){
    for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)bodyMask[j*GW+i]=dreamed(i,j,t)
  }
  if(started&&!inscribed){
    rebuildOutline(t)
    // a fixed target, not a share of the outline: with a live camera the outline
    // size swings wildly frame to frame, which made progress lurch and stall
    target=W<560?110:180
    // reading: the lamp passes over the outline and the letters arrive
    if(P.has){
      const R=Math.max(38,Math.min(W,H)*0.055), R2=R*R
      for(const [,m] of marks){
        if(m.read)continue
        const [x,y]=markScreen(m)
        const dx=x-P.x,dy=y-P.y
        if(dx*dx+dy*dy<R2){m.read=1;m.t=t;readN++}
      }
    }
    $('#sRead').textContent=readN
    advance()
    Mesh.send(clamp(P.x/W,0,1),clamp(P.y/H,0,1),frac())
    if(((now/1000)|0)%3===0)Mesh.sweep()
  }
  if(inscribed)condense=Math.min(1,condense+(REDUCED?0.02:0.006))

  ctx.clearRect(0,0,W,H)

  // the core: everything read gathers into one flat disc — hot at the heart,
  // the one solid form in the piece
  coreCX=W*0.5;coreCY=H*0.40;coreR=Math.min(W,H)*0.17
  const ease=condense<0.5?2*condense*condense:1-Math.pow(-2*condense+2,2)/2

  // When the Keeper asks, the world goes quiet. This is the fix for the question
  // being unreadable through the letters, and it is also the right dramaturgy:
  // the reading stops while you are being addressed.
  const askOpen=asking!==null
  quiet+=((askOpen?0.14:1)-quiet)*(REDUCED?1:0.08)

  for(const [,m] of marks){
    let [x,y]=markScreen(m)
    if(inscribed){
      // spiral inward to the rim of the core, flattened
      const a=(m.i*0.37+m.j*0.61)
      const tx=coreCX+Math.cos(a)*coreR*0.92*(0.35+0.65*((m.i%7)/7))
      const ty=coreCY+Math.sin(a)*coreR*0.44*(0.35+0.65*((m.j%5)/5))
      x=x+(tx-x)*ease;y=y+(ty-y)*ease
    }
    if(m.read){
      const age=Math.min(1,(t-m.t)/1.1)
      ctx.globalAlpha=(0.28+0.72*age)*(inscribed?1:0.92)*quiet
      ctx.fillStyle='#f2efe9'
      ctx.font='300 '+(FS+age*FS*0.22).toFixed(1)+'px "Noto Serif Armenian",Georgia,serif'
      ctx.textAlign='center';ctx.textBaseline='middle'
      ctx.fillText(m.g,x,y)
    }else{
      ctx.globalAlpha=0.13*quiet
      ctx.fillStyle='#f2efe9'
      ctx.fillRect(x-0.6,y-0.6,1.2,1.2)
    }
  }

  if(inscribed&&condense>0.55){
    const a=(condense-0.55)/0.45
    ctx.globalAlpha=0.14*a
    ctx.fillStyle='#f2efe9'
    ctx.beginPath();ctx.ellipse(coreCX,coreCY,coreR*0.98,coreR*0.47,0,0,6.2832);ctx.fill()
    ctx.globalAlpha=0.5*a
    ctx.font='300 '+Math.round(Math.min(W,H)*0.045)+'px "Noto Serif Armenian",Georgia,serif'
    ctx.textAlign='center';ctx.textBaseline='middle'
    ctx.fillText(word,coreCX,coreCY)
    ctx.globalAlpha=0.34*a
    ctx.font='300 '+Math.round(Math.min(W,H)*0.026)+'px "Noto Serif Armenian",Georgia,serif'
    ctx.fillText(name,coreCX,coreCY-coreR*0.72)
  }

  // the others, one faint point each — no labels, no lamps, no rings
  if(Mesh.peers.size){
    for(const[,pr]of Mesh.peers){
      ctx.globalAlpha=0.34*quiet
      ctx.fillStyle='#f2efe9'
      ctx.beginPath();ctx.arc((1-pr.x)*W,pr.y*H,2.2,0,6.2832);ctx.fill()
    }
  }

  // the lamp itself: a single ring. One mark, not three.
  if(started&&!inscribed&&P.has){
    ctx.globalAlpha=0.5*quiet
    ctx.strokeStyle='#f2efe9';ctx.lineWidth=1
    ctx.beginPath();ctx.arc(P.x,P.y,hand.has?15:11,0,6.2832);ctx.stroke()
    ctx.globalAlpha=0.9*quiet
    ctx.beginPath();ctx.arc(P.x,P.y,1.4,0,6.2832);ctx.fill()
  }

  ctx.globalAlpha=1
  requestAnimationFrame(frame)
}
resize()
requestAnimationFrame(frame)
</script>
</body>
</html>
